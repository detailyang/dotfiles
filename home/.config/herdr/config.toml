onboarding = false

[remote]
manage_ssh_config = true


[theme]
name = "catppuccin-latte"

# Subtle Latte surfaces keep the borderless sidebar distinct from panes.
[theme.custom]
sidebar_bg = "#e6e9ef"
active_row_bg = "#dce0e8"
selection_bg = "#ccd0da"

[terminal]
default_shell = "fish"
shell_mode = "login"

[keys]
# Match the tmux prefix in ~/.tmux.conf.
prefix = "ctrl+a"
detach = "prefix+d"

# tmux-like pane navigation.
focus_pane_left = "prefix+h"
focus_pane_down = "prefix+j"
focus_pane_up = "prefix+k"
focus_pane_right = "prefix+l"

# tmux-like tab/window lifecycle.
# In your tmux config: prefix+t creates a window, prefix+c kills a window.
new_tab = "prefix+t"
close_tab = "prefix+c"

# tmux-like splits.
# In your tmux config: prefix+| splits left/right, prefix+- splits top/bottom.
split_vertical = "prefix+|"
split_horizontal = "prefix+minus"

# Workspace/spaces and agent navigation.
workspace_picker = ["prefix+w", "ctrl+w"]
goto = "prefix+g"
switch_workspace = ["prefix+shift+1..9", "ctrl+1..9"]
focus_agent = "prefix+alt+1..9"
previous_workspace = "prefix+shift+left"
next_workspace = "prefix+shift+right"

# Navigation keys used after entering workspace navigation mode with prefix+w.
navigate_workspace_up = "k"
navigate_workspace_down = "j"
navigate_pane_left = "h"
navigate_pane_down = "ctrl+j"
navigate_pane_up = "ctrl+k"
navigate_pane_right = "l"

# Keep common Herdr actions available without stealing your tmux-like keys.
reload_config = "prefix+r"
zoom = "prefix+z"
close_pane = "prefix+x"
resize_mode = "prefix+shift+r"
toggle_sidebar = "prefix+shift+b"

# Avoid default bindings that conflict with your tmux habits.
next_tab = "prefix+n"
previous_tab = "prefix+p"

[[keys.command]]
# Approximation of your tmux popup snippet binding: opens as a temporary Herdr pane.
key = "prefix+o"
type = "pane"
command = "$HOME/bin/snippet"

[ui]
# Narrower default while still fitting two-line agent/space rows.
sidebar_width = 22
sidebar_min_width = 16
# Keep auto-scaling from widening beyond this on long workspace names.
sidebar_max_width = 28

prompt_new_tab_name = false
# No borders, outer frame, or gaps around panes: no empty space at all.
pane_borders = "off"
pane_outer_borders = false
pane_gaps = false
agent_panel_sort = "priority"
# Reclaim the scrollbar column; wheel and keyboard scrolling still work.
pane_scrollbars = false
# Single-tab workspaces do not need a tab row.
hide_tab_bar_when_single_tab = true
# Use distinct glyphs instead of color-only dots for agent state.
status_indicators = "symbols"
# Match the blue used for workspace labels in sidebar rows.
accent = "#1e66f5"

# Keep status colors dynamic while emphasizing identity and de-emphasizing context.
[ui.sidebar.agents]
row_gap = 0
rows = [
  [
    { token = "state_icon", bold = true, dim = false },
    { token = "workspace", fg = "#1e66f5", bold = true, dim = false },
    { token = "tab", fg = "#7c7f93", bold = false, dim = true },
  ],
  [
    { token = "agent", fg = "#8839ef", bold = true, dim = false },
  ],
]

# Agent overrides replace the full layout, so keep these rows in sync with rows above.
[ui.sidebar.agents.rows_by_agent]
pi = [
  [
    { token = "state_icon", bold = true, dim = false },
    { token = "workspace", fg = "#1e66f5", bold = true, dim = false },
    { token = "tab", fg = "#7c7f93", bold = false, dim = true },
  ],
  [
    { token = "agent", fg = "#8839ef", bold = true, dim = false },
  ],
]
claude = [
  [
    { token = "state_icon", bold = true, dim = false },
    { token = "workspace", fg = "#1e66f5", bold = true, dim = false },
    { token = "tab", fg = "#7c7f93", bold = false, dim = true },
  ],
  [
    { token = "agent", fg = "#1e66f5", bold = true, dim = false },
  ],
]
codex = [
  [
    { token = "state_icon", bold = true, dim = false },
    { token = "workspace", fg = "#1e66f5", bold = true, dim = false },
    { token = "tab", fg = "#7c7f93", bold = false, dim = true },
  ],
  [
    { token = "agent", fg = "#d20f39", bold = true, dim = false },
  ],
]

[ui.sidebar.spaces]
row_gap = 0
rows = [
  [
    { token = "state_icon", bold = true, dim = false },
    { token = "workspace", fg = "#1e66f5", bold = true, dim = false },
  ],
  [
    { token = "branch", fg = "#179299", bold = false, dim = true },
    { token = "git_status", bold = false, dim = true },
  ],
]

# Visual feedback for background agents while sound stays off.
[ui.toast]
delivery = "herdr"
delay_seconds = 1

[ui.toast.herdr]
position = "bottom-right"

[ui.sound]
enabled = false

[experimental]
# Let prefix mode switch the host input source so Ctrl+A works with an IME.
switch_ascii_input_source_in_prefix = true
# Keep the macOS IME candidate window anchored in agent TUIs.
reveal_hidden_cursor_for_cjk_ime = true
cjk_ime_agents = ["pi", "claude", "codex"]
